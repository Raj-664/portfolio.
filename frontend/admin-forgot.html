<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Admin Password | Emamuddin Mallick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <a class="login-brand" href="/">emam<span class="brand-dot">.</span>dev</a>
      <h1>Reset Password</h1>
      <p class="login-sub">Use your private recovery key to create a new admin password.</p>
      <form id="forgot-password-form" novalidate>
        <div class="form-group">
          <label for="forgot-username">Username</label>
          <input type="text" id="forgot-username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="recovery-key">Recovery key</label>
          <div class="password-field">
            <input type="password" id="recovery-key" autocomplete="off" required />
            <button type="button" class="password-toggle" data-password-toggle="recovery-key"
                    aria-label="Show recovery key" aria-pressed="false" title="Show recovery key">
              <svg class="password-toggle-icon icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
              <svg class="password-toggle-icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.1 3.8"></path>
                <path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="forgot-new-password">New password (min 8 characters)</label>
          <div class="password-field">
            <input type="password" id="forgot-new-password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-password-toggle="forgot-new-password"
                    aria-label="Show new password" aria-pressed="false" title="Show new password">
              <svg class="password-toggle-icon icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
              <svg class="password-toggle-icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.1 3.8"></path>
                <path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="forgot-confirm-password">Confirm new password</label>
          <div class="password-field">
            <input type="password" id="forgot-confirm-password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-password-toggle="forgot-confirm-password"
                    aria-label="Show confirmation password" aria-pressed="false" title="Show confirmation password">
              <svg class="password-toggle-icon icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
              <svg class="password-toggle-icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.1 3.8"></path>
                <path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="form-status" id="forgot-status" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">Reset Password</button>
      </form>
      <a class="login-back" href="/admin/login">&larr; Back to admin login</a>
    </div>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
