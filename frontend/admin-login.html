<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd343'/%3E%3Cstop offset='1' stop-color='%234b8bbe'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%23121212'%3EE%3C/text%3E%3C/svg%3E">
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login | Emamuddin Mallick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <a class="login-brand" href="/">emam<span class="brand-dot">.</span>dev</a>
      <h1>Admin Login</h1>
      <p class="login-sub">Sign in to manage projects and certificates.</p>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" data-password-toggle="password"
                    aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="password-toggle-icon icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
              <svg class="password-toggle-icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.1 3.8"></path>
                <path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
      </form>
      <a class="forgot-link" href="/admin/forgot-password">Forgot Password?</a>
      <a class="login-back" href="/">&larr; Back to portfolio</a>
    </div>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
